name: Daily deploy (fresh data)

on:
  schedule:
    # 6:00 AM US Eastern every day (11:00 UTC, adjusts for DST)
    - cron: "0 11 * * *"
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK }}"
