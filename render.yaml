services:
  - type: web
    name: engg119-finalproject-apguru
    runtime: docker
    dockerfilePath: Dockerfile.render
    envVars:
      - key: ENV
        value: development
      - key: AUTH_DEV_BYPASS
        value: "1"
      - key: CORS_ORIGINS
        value: ""

  - type: web
    name: educore-finance-desk
    runtime: docker
    dockerfilePath: Dockerfile.streamlit
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
